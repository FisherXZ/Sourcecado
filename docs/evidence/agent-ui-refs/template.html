<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Swap these tokens to match the project's DESIGN.md if it has one. Keep the class names. */
:root{--bg:#1C1A17;--raised:#252320;--overlay:#2E2C28;--ink:#FFF8EB;--ink2:rgba(255,248,235,.82);
--rule:rgba(255,248,235,.08);--rule2:rgba(255,248,235,.12);--amber:#E8A230;--amberM:rgba(232,162,48,.15);--green:#5CB77A;--red:#D4614E;
--serif:'Lora',Georgia,serif;--sans:'Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink2);font:14px/1.5 var(--sans)}
a{color:var(--amber);text-decoration:none}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0}
h1{font-size:38px;letter-spacing:-.015em;line-height:1.1}
h2{font-size:20px;letter-spacing:-.01em}
h3{font-size:16px;font-weight:500}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
@media(max-width:640px){.wrap{padding:0 16px}h1{font-size:28px}}
.over{font:500 13px var(--sans);color:var(--ink2)}
header{padding:56px 0 24px;border-bottom:1px solid var(--rule)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tile{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--rule2);border-radius:8px;font-size:13px}
.tile b{color:var(--ink);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;padding:24px 0;border-bottom:1px solid var(--rule)}
.top.solo{grid-template-columns:1fr}
@media(max-width:900px){.top{grid-template-columns:1fr}}
.panel{background:var(--raised);border:1px solid var(--rule);border-radius:12px;padding:16px;overflow-x:auto}
.graph{width:100%;min-width:640px;height:auto;display:block}
.graph .e{fill:none;stroke:var(--rule2);stroke-width:1.4}
.graph .n rect{fill:var(--bg);stroke-width:1.4}
.graph .n:hover rect{fill:var(--overlay)}
.graph .k{font:500 11px var(--mono);fill:var(--ink)}
.graph .s{font:11px var(--sans);fill:var(--ink2)}
.log{list-style:none;margin:8px 0 0;padding:0;max-height:300px;overflow:auto;font-size:13px}
.log li{padding:6px 0;border-bottom:1px solid var(--rule)}
.lt{display:block;font:13px var(--mono);color:var(--ink2)}
section{padding:32px 0;border-bottom:1px solid var(--rule)}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.num{font:500 13px var(--mono)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:13px;background:rgba(255,248,235,.08);color:var(--ink)}
.prl{background:var(--amberM);color:var(--amber)}
.empty{border:1px dashed var(--rule2);border-radius:8px;padding:18px;color:var(--ink2);font-size:14px}
/* shared classes agents use inside fragments */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ev-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0 28px;align-items:start}
@media(max-width:900px){.ev-row{grid-template-columns:1fr}}
.ev-card{background:var(--raised);border:1px solid var(--rule);border-radius:8px;padding:14px}
.ev-card h3{margin-bottom:8px}
.ev-table{width:100%;border-collapse:collapse;font-size:13px}
.ev-table th{font:600 13px var(--sans);color:var(--ink);text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule2)}
.ev-table td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.ev-pass{color:var(--green)} .ev-fail{color:var(--red)} .ev-warn{color:var(--amber)}
.ev-img{max-width:100%;border:1px solid var(--rule2);border-radius:8px;display:block}
.ev-mob{max-width:260px}
.ev-cap{font-size:14px;color:var(--ink2);margin-top:6px}
.ev-code{font:13px/1.5 var(--mono);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px;white-space:pre-wrap;overflow-x:auto;color:var(--ink2)}
.ev-svg{width:100%;height:auto}
.fx svg text{fill:var(--ink2);font-family:var(--sans)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="over">Live evidence · refreshes every 60 s · assembled {{STAMP}}</div>
  <h1 style="margin-top:10px">{{TITLE}}</h1>
  <p style="max-width:720px;margin:10px 0 0">{{INTRO}}</p>
  <div class="tiles">{{TILES}}</div>
</div></header>
<div class="wrap">
  {{TOP}}
  {{REFS}}
  {{SECTIONS}}
</div>
<div style="height:80px"></div>
</body>
</html>
