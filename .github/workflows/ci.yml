name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sidecar:
    name: Python sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt

      - name: Test
        working-directory: desktop
        run: pytest -q

  gui:
    name: Desktop GUI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: desktop/surfaces/gui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/surfaces/gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck and build
        run: npm run build
